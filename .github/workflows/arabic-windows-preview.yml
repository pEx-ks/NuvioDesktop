name: Build Arabic Windows Preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Fetch Windows runtime
        shell: bash
        run: git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare standalone configuration
        shell: pwsh
        run: New-Item -ItemType File -Path local.properties -Force
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4078.44 -OutputDirectory "$env:RUNNER_TEMP\nuget" -DirectDownload -NonInteractive -NoCache
          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.1.0.4078.44"
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile test and package
        shell: pwsh
        run: |
          & .\gradlew.bat :composeApp:desktopTest :composeApp:packageMsi "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" "-Pcompose.desktop.packaging.checkJdkVendor=false" --no-configuration-cache --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arabic-windows-preview
          path: |
            composeApp/build/compose/release-msis/*.msi
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/reports/tests/
          if-no-files-found: warn
